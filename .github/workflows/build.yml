name: Build and Push OCI Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            arch: aarch64
            runs-on: ubuntu-24.04-arm
          - system: x86_64-linux
            arch: x86_64
            runs-on: ubuntu-latest

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build OCI Images
        run: |
          echo "Building base container image..."
          nix build .#packages.${{ matrix.system }}.base
          echo "Building helixblast-builder container image..."
          nix build .#packages.${{ matrix.system }}.helixblast-builder

      - name: Push Images to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_REF="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          CREDS="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"

          echo "==> Pushing base container image..."
          nix run .#packages.${{ matrix.system }}.base.copyTo -- \
            "docker://${IMAGE_REF}:base-${{ matrix.arch }}-latest" \
            --dest-creds "$CREDS"

          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            nix run .#packages.${{ matrix.system }}.base.copyTo -- \
              "docker://${IMAGE_REF}:base" \
              --dest-creds "$CREDS"
          fi

          echo "==> Pushing helixblast-builder container image..."
          nix run .#packages.${{ matrix.system }}.helixblast-builder.copyTo -- \
            "docker://${IMAGE_REF}:${{ matrix.arch }}-latest" \
            --dest-creds "$CREDS"

          nix run .#packages.${{ matrix.system }}.helixblast-builder.copyTo -- \
            "docker://${IMAGE_REF}:helixblast-${{ matrix.arch }}-latest" \
            --dest-creds "$CREDS"

          nix run .#packages.${{ matrix.system }}.helixblast-builder.copyTo -- \
            "docker://${IMAGE_REF}:${{ matrix.arch }}-${{ github.sha }}" \
            --dest-creds "$CREDS"

          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            echo "Pushing default latest tag for aarch64..."
            nix run .#packages.${{ matrix.system }}.helixblast-builder.copyTo -- \
              "docker://${IMAGE_REF}:latest" \
              --dest-creds "$CREDS"
          fi
