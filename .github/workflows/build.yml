name: Build and Push OCI Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            arch: aarch64
            runs-on: ubuntu-24.04-arm
          - system: x86_64-linux
            arch: x86_64
            runs-on: ubuntu-latest

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build OCI Images
        run: |
          echo "Building base-dev container image..."
          nix build .#packages.${{ matrix.system }}.base-dev
          echo "Building helixblast-dev container image..."
          nix build .#packages.${{ matrix.system }}.helixblast-dev

      - name: Push Images to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          CREDS="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"

          echo "==> Pushing ghcr.io/${OWNER}/base-dev..."
          nix run .#packages.${{ matrix.system }}.base-dev.copyTo -- \
            "docker://ghcr.io/${OWNER}/base-dev:${{ matrix.arch }}-latest" \
            --dest-creds "$CREDS"

          nix run .#packages.${{ matrix.system }}.base-dev.copyTo -- \
            "docker://ghcr.io/${OWNER}/base-dev:${{ matrix.arch }}-${{ github.sha }}" \
            --dest-creds "$CREDS"

          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            nix run .#packages.${{ matrix.system }}.base-dev.copyTo -- \
              "docker://ghcr.io/${OWNER}/base-dev:latest" \
              --dest-creds "$CREDS"
          fi

          echo "==> Pushing ghcr.io/${OWNER}/helixblast-dev..."
          nix run .#packages.${{ matrix.system }}.helixblast-dev.copyTo -- \
            "docker://ghcr.io/${OWNER}/helixblast-dev:${{ matrix.arch }}-latest" \
            --dest-creds "$CREDS"

          nix run .#packages.${{ matrix.system }}.helixblast-dev.copyTo -- \
            "docker://ghcr.io/${OWNER}/helixblast-dev:${{ matrix.arch }}-${{ github.sha }}" \
            --dest-creds "$CREDS"

          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            nix run .#packages.${{ matrix.system }}.helixblast-dev.copyTo -- \
              "docker://ghcr.io/${OWNER}/helixblast-dev:latest" \
              --dest-creds "$CREDS"
          fi
