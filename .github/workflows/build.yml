name: Build and Push OCI Images

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find container modules
        id: find
        run: |
          # Find all .nix files in modules/ except base.nix
          MODULES=$(find modules -maxdepth 1 -name '*.nix' ! -name 'base.nix' -exec basename {} .nix \; | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "Discovered modules: $MODULES"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover-modules
    if: needs.discover-modules.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        system-target:
          - system: aarch64-linux
            arch: aarch64
            runs-on: ubuntu-24.04-arm
          - system: x86_64-linux
            arch: x86_64
            runs-on: ubuntu-latest
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}

    runs-on: ${{ matrix.system-target.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build OCI Image (${{ matrix.module }} / ${{ matrix.system-target.system }})
        run: |
          nix build .#packages.${{ matrix.system-target.system }}.${{ matrix.module }}

      - name: Push Architecture-Specific Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          MODULE="${{ matrix.module }}"
          ARCH="${{ matrix.system-target.arch }}"
          PKG_REF="ghcr.io/${OWNER}/${MODULE}"
          CREDS="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"

          echo "==> Pushing ${PKG_REF}:${ARCH}-latest..."
          nix run .#packages.${{ matrix.system-target.system }}.${MODULE}.copyTo -- \
            "docker://${PKG_REF}:${ARCH}-latest" \
            --dest-creds "$CREDS"

          echo "==> Pushing ${PKG_REF}:${ARCH}-${{ github.sha }}..."
          nix run .#packages.${{ matrix.system-target.system }}.${MODULE}.copyTo -- \
            "docker://${PKG_REF}:${ARCH}-${{ github.sha }}" \
            --dest-creds "$CREDS"

  merge-manifests:
    needs: [discover-modules, build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Multi-Arch Manifest Index
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          MODULE="${{ matrix.module }}"
          PKG_REF="ghcr.io/${OWNER}/${MODULE}"

          echo "==> Creating multi-arch manifest for ${PKG_REF}:latest..."
          docker buildx imagetools create \
            -t "${PKG_REF}:latest" \
            "${PKG_REF}:aarch64-latest" \
            "${PKG_REF}:x86_64-latest"

          echo "==> Creating multi-arch manifest for ${PKG_REF}:${{ github.sha }}..."
          docker buildx imagetools create \
            -t "${PKG_REF}:${{ github.sha }}" \
            "${PKG_REF}:aarch64-${{ github.sha }}" \
            "${PKG_REF}:x86_64-${{ github.sha }}"
